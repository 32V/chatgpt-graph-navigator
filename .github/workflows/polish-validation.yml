name: Validate final polish

on:
  push:
    branches:
      - polish/final-pass

permissions:
  contents: write

concurrency:
  group: final-polish-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run validate
      - name: Mark validated tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f ci-validated-polish "$GITHUB_SHA"
          git push -f origin refs/tags/ci-validated-polish
