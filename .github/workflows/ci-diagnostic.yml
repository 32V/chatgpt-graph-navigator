name: Temporary CI diagnostic

on:
  push:
    branches:
      - fix/api-backed-navigation

permissions:
  contents: write

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/api-backed-navigation

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Run checks and record results
        shell: bash
        run: |
          set +e
          report="scripts/ci-diagnostic.txt"
          : > "$report"
          echo "CI diagnostic for ${GITHUB_SHA}" >> "$report"
          echo >> "$report"

          run_check() {
            name="$1"
            shift
            log="/tmp/ci-${name// /-}.log"
            echo "== $name ==" >> "$report"
            "$@" >"$log" 2>&1
            code=$?
            echo "exit_code=$code" >> "$report"
            cat "$log" >> "$report"
            echo >> "$report"
            return $code
          }

          run_check "npm ci" npm ci
          npm_code=$?
          if [ "$npm_code" -eq 0 ]; then
            run_check "english check" node scripts/check-no-chinese.mjs
            run_check "compat test" node scripts/test-edit-pagination-compat.mjs
            run_check "layout test" node scripts/test-qa-tree-layout.mjs
            run_check "release build" npm run release
          fi
          cat "$report"

      - name: Commit diagnostic report
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/ci-diagnostic.txt
          git commit -m "chore(ci): record diagnostic results" || exit 0
          git push origin HEAD:fix/api-backed-navigation
