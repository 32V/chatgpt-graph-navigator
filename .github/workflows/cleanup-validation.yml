name: Validate cleanup branch

on:
  push:
    branches:
      - cleanup/final-architecture

permissions:
  contents: write

concurrency:
  group: cleanup-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Normalize package lock metadata
        id: normalize
        shell: bash
        run: |
          set -euo pipefail
          npm install --package-lock-only --ignore-scripts
          if git diff --quiet -- package-lock.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: normalize package lock metadata"
          git push origin HEAD:"${GITHUB_REF_NAME}"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Run complete validation
        if: steps.normalize.outputs.changed == 'false'
        shell: bash
        run: |
          set -euo pipefail
          {
            echo '== npm ci =='
            npm ci
            echo '== English-only check =='
            node scripts/check-no-chinese.mjs
            echo '== edit-pagination compatibility =='
            node scripts/test-edit-pagination-compat.mjs
            echo '== canonical current node =='
            node scripts/test-current-node.mjs
            echo '== stable graph layout =='
            node scripts/test-qa-tree-layout.mjs
            echo '== production release =='
            npm run release
            echo '== packaged extension =='
            test -f release/manifest.json
            test -f release/dist/edit-pagination-compat.js
            test -f release/dist/docked-panel.js
            test -f release/dist/docked-panel.css
            test -f release/dist/content.js
            test -f release/dist/background.js
            test -f release/dist/popup.js
            test -f release/dist/setup.js
            test -f release/dist/sidepanel.js
            test -f release/dist/sidepanel.css
            test ! -e release/dist/docked-panel-theme.css
            test ! -e release/dist/chatgpt-theme.css
            test ! -e release/dist/graph-ux.css
            test ! -d release/_locales
            node -e "JSON.parse(require('fs').readFileSync('release/manifest.json', 'utf8'))"
          } 2>&1 | tee cleanup-validation.log

      - name: Capture validation failure
        if: failure() && steps.normalize.outputs.changed == 'false'
        shell: bash
        run: |
          set -euo pipefail
          if test -e scripts/validation-failure.log; then
            exit 0
          fi
          cp cleanup-validation.log scripts/validation-failure.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/validation-failure.log
          git commit -m "chore(ci): capture cleanup validation failure"
          git push origin HEAD:"${GITHUB_REF_NAME}"

      - name: Mark validated head
        if: success() && steps.normalize.outputs.changed == 'false'
        shell: bash
        run: |
          set -euo pipefail
          git tag -f ci-validated-cleanup "$GITHUB_SHA"
          git push -f origin refs/tags/ci-validated-cleanup
