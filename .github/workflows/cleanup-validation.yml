name: Validate cleanup branch

on:
  push:
    branches:
      - cleanup/final-architecture

permissions:
  contents: write

concurrency:
  group: cleanup-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Normalize package lock
        id: lock
        shell: bash
        run: |
          set -euo pipefail
          npm install --package-lock-only --ignore-scripts
          if git diff --quiet -- package-lock.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: normalize package lock"
          git push origin HEAD:"${GITHUB_REF_NAME}"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        if: steps.lock.outputs.changed == 'false'
        run: npm ci

      - name: Check English-only source and docs
        if: steps.lock.outputs.changed == 'false'
        run: node scripts/check-no-chinese.mjs

      - name: Test edit-pagination compatibility
        if: steps.lock.outputs.changed == 'false'
        run: node scripts/test-edit-pagination-compat.mjs

      - name: Test canonical current node
        if: steps.lock.outputs.changed == 'false'
        run: node scripts/test-current-node.mjs

      - name: Test stable graph layout
        if: steps.lock.outputs.changed == 'false'
        run: node scripts/test-qa-tree-layout.mjs

      - name: Build production extension
        if: steps.lock.outputs.changed == 'false'
        run: npm run release

      - name: Verify packaged extension
        if: steps.lock.outputs.changed == 'false'
        shell: bash
        run: |
          set -euo pipefail
          test -f release/manifest.json
          test -f release/dist/edit-pagination-compat.js
          test -f release/dist/docked-panel.js
          test -f release/dist/docked-panel.css
          test -f release/dist/content.js
          test -f release/dist/background.js
          test -f release/dist/popup.js
          test -f release/dist/setup.js
          test -f release/dist/sidepanel.js
          test -f release/dist/sidepanel.css
          test -f release/src/popup/index.html
          test -f release/src/setup/index.html
          test -f release/src/sidepanel/index.html
          test ! -e release/dist/docked-panel-theme.css
          test ! -e release/dist/chatgpt-theme.css
          test ! -e release/dist/graph-ux.css
          test ! -d release/_locales
          node -e "JSON.parse(require('fs').readFileSync('release/manifest.json', 'utf8'))"

      - name: Mark validated head
        if: steps.lock.outputs.changed == 'false'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f ci-validated-cleanup "$GITHUB_SHA"
          git push -f origin refs/tags/ci-validated-cleanup
