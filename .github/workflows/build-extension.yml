name: Build installable extension

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: extension-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Validate and package Chrome extension
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate source and release package
        run: npm run validate

      - name: Upload ready-to-load extension
        uses: actions/upload-artifact@v4
        with:
          name: chatgpt-graph-extension-${{ github.run_number }}-${{ github.sha }}
          path: release/
          if-no-files-found: error
          retention-days: 30
          compression-level: 9
