name: One-time English cleanup

on:
  push:
    branches:
      - fix/api-backed-navigation

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/api-backed-navigation

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Strip remaining Han comments
        run: node scripts/strip-han-comments.mjs

      - name: Commit cleanup
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No cleanup changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: strip remaining non-English comments"
          git push origin HEAD:fix/api-backed-navigation
