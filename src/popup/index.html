<!DOCTYPE html>
<html lang="en" data-i18n-title="popupTitle">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ChatGPT Graph Navigator</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f7f7f7;
      --surface: #ffffff;
      --surface-hover: #f2f2f2;
      --text: #171717;
      --muted: #6b6b6b;
      --subtle: #8a8a8a;
      --border: #e5e5e5;
      --border-light: #eeeeee;
      --accent: #171717;
      --success: #147d36;
      --success-bg: #e2f5e8;
      --warning: #8a5a00;
      --warning-bg: #fff2cc;
      --error: #b4232c;
      --error-bg: #ffe7e9;
      --radius: 10px;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #171717;
        --surface: #212121;
        --surface-hover: #2b2b2b;
        --text: #ececec;
        --muted: #b4b4b4;
        --subtle: #8f8f8f;
        --border: #393939;
        --border-light: #303030;
        --accent: #ececec;
        --success: #8bd6a2;
        --success-bg: #163c22;
        --warning: #e8c26c;
        --warning-bg: #443614;
        --error: #f0a3a8;
        --error-bg: #471d21;
      }
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      width: 350px;
      max-height: 600px;
      overflow-y: auto;
      font: 13px/1.45 ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    button, input { font: inherit; }
    button { color: inherit; }

    .header {
      position: sticky;
      top: 0;
      z-index: 4;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 14px;
      border-bottom: 1px solid var(--border);
      background: color-mix(in srgb, var(--bg) 92%, transparent);
      backdrop-filter: blur(12px);
    }

    .brand { display: flex; align-items: center; gap: 9px; min-width: 0; }
    .brand-icon { width: 30px; height: 30px; border-radius: 8px; overflow: hidden; flex: 0 0 auto; }
    .brand-icon img { width: 100%; height: 100%; display: block; }
    .brand-info { min-width: 0; }
    .brand-info h1 { margin: 0; font-size: 13px; font-weight: 650; letter-spacing: -.01em; }
    .brand-info p { margin: 1px 0 0; font-size: 11px; color: var(--subtle); }

    .header-settings-btn {
      margin-left: auto;
      width: 30px;
      height: 30px;
      display: grid;
      place-items: center;
      border: 0;
      border-radius: 8px;
      background: transparent;
      cursor: pointer;
    }
    .header-settings-btn:hover { background: var(--surface-hover); }
    .header-settings-btn svg { width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 1.6; }

    .popup-settings-panel { padding: 12px 14px 0; }
    .popup-settings-panel.collapsed { display: none; }
    .content-wrapper { padding: 14px; display: grid; gap: 12px; }

    .status, .token-info, .help, .collapse-settings, .popup-settings-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
    }

    .status { padding: 4px 12px; }
    .status-item {
      min-height: 38px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .status-item + .status-item { border-top: 1px solid var(--border-light); }
    .status-label { color: var(--muted); font-weight: 500; }
    .status-value { font-size: 11px; padding: 3px 8px; border-radius: 999px; background: var(--surface-hover); }
    .status-value.success { color: var(--success); background: var(--success-bg); }
    .status-value.warning { color: var(--warning); background: var(--warning-bg); }
    .status-value.error { color: var(--error); background: var(--error-bg); }

    .token-info { padding: 12px; }
    .token-info h3, .collapse-settings h3, .popup-settings-card h3 {
      margin: 0;
      font-size: 12px;
      font-weight: 650;
    }
    .token-preview {
      margin-top: 8px;
      padding: 8px 9px;
      border-radius: 7px;
      background: var(--bg);
      border: 1px solid var(--border-light);
      color: var(--muted);
      font: 10.5px/1.45 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      word-break: break-all;
    }
    .token-time { margin-top: 8px; color: var(--subtle); font-size: 11px; }

    .help { padding: 11px 12px; }
    .help p { margin: 0; color: var(--muted); font-size: 11.5px; }
    .help strong { color: var(--text); }

    .actions { display: flex; gap: 8px; }
    .actions button, .mini-btn {
      flex: 1;
      min-height: 34px;
      padding: 7px 10px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--surface);
      cursor: pointer;
      transition: background .12s ease, border-color .12s ease;
    }
    .actions button:hover, .mini-btn:hover { background: var(--surface-hover); }
    .actions button.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: var(--bg);
      font-weight: 600;
    }

    .popup-settings-card h3 { padding: 11px 12px 4px; }
    .setting-help { margin: 0; padding: 0 12px 9px; color: var(--muted); font-size: 11px; border-bottom: 1px solid var(--border-light); }
    .stream-mode-option { display: flex; gap: 9px; padding: 10px 12px; cursor: pointer; }
    .stream-mode-option + .stream-mode-option { border-top: 1px solid var(--border-light); }
    .stream-mode-option:hover { background: var(--surface-hover); }
    .stream-mode-option input { margin-top: 2px; accent-color: currentColor; }
    .stream-mode-option span { display: grid; gap: 2px; }
    .stream-mode-option strong { font-size: 12px; }
    .stream-mode-option small { color: var(--muted); font-size: 10.5px; }

    .collapse-settings h3 { padding: 10px 12px; border-bottom: 1px solid var(--border-light); }
    .setting-item { min-height: 38px; padding: 7px 12px; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .setting-item + .setting-item { border-top: 1px solid var(--border-light); }
    .setting-item label { display: flex; align-items: center; gap: 8px; cursor: pointer; }
    .setting-item input[type="checkbox"] { accent-color: currentColor; }
    .setting-item input[type="number"] {
      width: 66px; padding: 5px 7px; color: inherit; background: var(--bg); border: 1px solid var(--border); border-radius: 7px;
    }
    .unit { color: var(--subtle); font-size: 10px; }
    .setting-group { margin-left: 20px; border-left: 1px solid var(--border-light); }
    .setting-disabled { opacity: .45; pointer-events: none; }

    .zoom-row { width: 100%; display: flex; align-items: center; gap: 8px; }
    .zoom-row input[type="range"] { flex: 1; }
    .mini-btn { flex: 0 0 auto; min-height: 28px; padding: 4px 8px; }

    .loading { min-height: 80px; display: grid; place-items: center; color: var(--muted); }
    .spinner { width: 18px; height: 18px; border: 2px solid var(--border); border-top-color: var(--text); border-radius: 50%; animation: spin .7s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-thumb { background: color-mix(in srgb, var(--text) 20%, transparent); border: 2px solid transparent; background-clip: padding-box; border-radius: 999px; }
  </style>
</head>
<body>
  <header class="header">
    <div class="brand">
      <div class="brand-icon"><img src="../../assets/icon48.png" alt=""></div>
      <div class="brand-info">
        <h1>ChatGPT Graph Navigator</h1>
        <p>Conversation tree controls</p>
      </div>
    </div>
    <button id="popup-settings-btn" class="header-settings-btn" type="button" aria-label="Answer grouping settings" aria-expanded="false">
      <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 3.2v2.1M10 14.7v2.1M3.2 10h2.1M14.7 10h2.1M5.2 5.2l1.5 1.5M13.3 13.3l1.5 1.5M14.8 5.2l-1.5 1.5M6.7 13.3l-1.5 1.5"/><circle cx="10" cy="10" r="2.6"/></svg>
    </button>
  </header>

  <div id="popup-settings-panel" class="popup-settings-panel collapsed"></div>

  <main class="content-wrapper">
    <div id="content">
      <div class="loading">
        <div class="spinner"></div>
        <p data-i18n="loading">Loading...</p>
      </div>
    </div>
  </main>

  <script src="../../dist/popup.js"></script>
</body>
</html>
